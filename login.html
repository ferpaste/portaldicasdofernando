<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acesso do Aluno | Dicas do Fernando</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style-base.css">

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['Roboto', 'sans-serif'], display: ['Archivo Black', 'sans-serif'] },
                    colors: { 'ob-orange': '#FF6B00', 'ob-dark': '#0f0f0f', 'ob-gray': '#1f1f1f' }
                }
            }
        }
    </script>
</head>
<body class="bg-concrete font-sans text-white h-screen flex flex-col selection:bg-ob-orange selection:text-black overflow-hidden relative">

    <header class="absolute top-0 left-0 w-full p-6 z-30 flex justify-between items-center">
        <div class="flex items-center gap-3">
            <div class="bg-ob-orange p-1.5 rounded transform rotate-3"><i data-lucide="hard-hat" class="w-6 h-6 text-black"></i></div>
            <div class="leading-none hidden md:block">
                <span class="block font-display text-sm text-white tracking-tighter">DICAS DO</span>
                <span class="block font-display text-lg text-ob-orange tracking-tighter -mt-1">FERNANDO</span>
            </div>
        </div>

        <a href="index.html" class="flex items-center gap-2 border border-white/20 hover:border-ob-orange bg-black/30 hover:bg-ob-orange hover:text-black px-5 py-2 rounded-full transition-all text-xs font-bold uppercase tracking-widest backdrop-blur-sm group">
            <i data-lucide="arrow-left" class="w-4 h-4 group-hover:-translate-x-1 transition-transform"></i>
            Voltar para Home
        </a>
    </header>

    <main class="flex-1 flex items-center justify-center relative p-6">
        
        <div class="absolute inset-0 z-0">
            <div class="absolute inset-0 bg-gradient-to-br from-black via-ob-dark/95 to-ob-orange/10"></div>
            <img src="fernando-obra-bg.jpg" class="w-full h-full object-cover opacity-30" alt="Fundo Obra">
        </div>

        <div class="relative z-10 w-full max-w-md bg-ob-dark/90 backdrop-blur-xl border border-white/10 p-8 md:p-10 rounded-2xl shadow-2xl overflow-hidden">
            <div class="absolute top-0 left-0 w-full h-1 bg-gradient-to-r from-ob-orange to-yellow-500"></div>

            <div class="text-center mb-8">
                <h1 class="font-display text-2xl text-white mb-2">ÁREA DO ALUNO</h1>
                <p class="text-gray-400 text-sm">Gerencie seus cursos e downloads.</p>
            </div>

            <div class="flex border-b border-white/10 mb-6">
                <button onclick="switchTab('login')" id="tab-login" class="flex-1 pb-3 text-ob-orange border-b-2 border-ob-orange font-bold text-sm uppercase transition-all tracking-wide">
                    Já tenho conta
                </button>
                <button onclick="switchTab('register')" id="tab-register" class="flex-1 pb-3 text-gray-500 font-bold text-sm uppercase hover:text-white transition-all tracking-wide">
                    Criar nova conta
                </button>
            </div>

            <form id="authForm" class="space-y-5">
                
                <div id="nameField" class="hidden animate-fade-in-up">
                    <label class="block text-[10px] font-bold text-gray-400 uppercase tracking-widest mb-1 ml-1">Seu Nome Completo</label>
                    <div class="relative">
                        <i data-lucide="user" class="absolute left-3 top-3 w-5 h-5 text-gray-500"></i>
                        <input type="text" id="name" placeholder="Ex: Fernando Silva" class="w-full bg-black/50 border border-white/10 rounded-lg py-2.5 pl-10 pr-4 text-white focus:border-ob-orange focus:outline-none transition-colors">
                    </div>
                </div>

                <div>
                    <label class="block text-[10px] font-bold text-gray-400 uppercase tracking-widest mb-1 ml-1">E-mail de Acesso</label>
                    <div class="relative">
                        <i data-lucide="mail" class="absolute left-3 top-3 w-5 h-5 text-gray-500"></i>
                        <input type="email" id="email" required placeholder="seu@email.com" class="w-full bg-black/50 border border-white/10 rounded-lg py-2.5 pl-10 pr-4 text-white focus:border-ob-orange focus:outline-none transition-colors">
                    </div>
                </div>

                <div>
                    <label class="block text-[10px] font-bold text-gray-400 uppercase tracking-widest mb-1 ml-1">Sua Senha</label>
                    <div class="relative">
                        <i data-lucide="lock" class="absolute left-3 top-3 w-5 h-5 text-gray-500"></i>
                        <input type="password" id="password" required placeholder="••••••••" class="w-full bg-black/50 border border-white/10 rounded-lg py-2.5 pl-10 pr-4 text-white focus:border-ob-orange focus:outline-none transition-colors">
                    </div>
                </div>

                <button type="submit" id="submitBtn" class="w-full bg-ob-orange text-black font-black uppercase tracking-wide py-4 rounded-lg hover:bg-white transition-all transform hover:-translate-y-1 shadow-[0_0_20px_rgba(255,107,0,0.3)] mt-6 flex items-center justify-center gap-2">
                    <i data-lucide="log-in" class="w-5 h-5"></i> ENTRAR AGORA
                </button>
            </form>

        </div>
    </main>

    <footer class="absolute bottom-0 w-full z-20 p-6 flex flex-col items-center justify-center gap-4 bg-gradient-to-t from-black via-black/80 to-transparent">
        <img src="logodf.png" alt="Logo Dicas do Fernando" class="h-12 w-auto opacity-80 drop-shadow-lg">
        <p class="text-xs md:text-sm text-gray-400 font-medium tracking-wide text-center">
            "Conhecimento de construção que acompanha você pra sempre."
        </p>
    </footer>

    <script>
        lucide.createIcons();
        let currentMode = 'login'; // Começa na aba de login

        // Alternar entre abas
        function switchTab(mode) {
            currentMode = mode;
            const nameField = document.getElementById('nameField');
            const submitBtn = document.getElementById('submitBtn');
            const tabLogin = document.getElementById('tab-login');
            const tabRegister = document.getElementById('tab-register');

            if (mode === 'register') {
                nameField.classList.remove('hidden');
                submitBtn.innerHTML = '<i data-lucide="user-plus" class="w-5 h-5"></i> CRIAR MINHA CONTA';
                
                // Estilo ativo para Criar Conta
                tabRegister.className = "flex-1 pb-3 text-ob-orange border-b-2 border-ob-orange font-bold text-sm uppercase transition-all tracking-wide";
                tabLogin.className = "flex-1 pb-3 text-gray-500 font-bold text-sm uppercase hover:text-white transition-all tracking-wide";
            } else {
                nameField.classList.add('hidden');
                submitBtn.innerHTML = '<i data-lucide="log-in" class="w-5 h-5"></i> ENTRAR AGORA';
                
                // Estilo ativo para Entrar
                tabLogin.className = "flex-1 pb-3 text-ob-orange border-b-2 border-ob-orange font-bold text-sm uppercase transition-all tracking-wide";
                tabRegister.className = "flex-1 pb-3 text-gray-500 font-bold text-sm uppercase hover:text-white transition-all tracking-wide";
            }
            lucide.createIcons(); // Recarrega ícones
        }

        // Processar Formulário
        document.getElementById('authForm').addEventListener('submit', function(e) {
            e.preventDefault();
            
            const email = document.getElementById('email').value.toLowerCase().trim();
            const password = document.getElementById('password').value;
            
            // Pega o banco de usuários do navegador (ou cria vazio)
            const users = JSON.parse(localStorage.getItem('usersDB')) || {};

            if (currentMode === 'register') {
                // --- LÓGICA DE CADASTRO ---
                const name = document.getElementById('name').value.trim();
                
                if (!name) { alert("Por favor, digite seu nome."); return; }
                
                if(users[email]) {
                    alert("Este e-mail já possui cadastro. Tente fazer login.");
                    switchTab('login');
                    return;
                }

                // Cria novo usuário (Bloqueado por padrão)
                users[email] = {
                    name: name,
                    email: email,
                    password: password, // Em produção real, nunca salve senhas assim!
                    pdfUnlocked: false,
                    physicalUnlocked: false,
                    courseUnlocked: false,
                    trackingCode: ""
                };

                localStorage.setItem('usersDB', JSON.stringify(users));
                localStorage.setItem('currentUser', email);
                
                alert("Conta criada com sucesso! Bem-vindo, " + name);
                window.location.href = 'dashboard.html';

            } else {
                // --- LÓGICA DE LOGIN ---
                if (users[email] && users[email].password === password) {
                    localStorage.setItem('currentUser', email); // Salva sessão
                    window.location.href = 'dashboard.html';
                } else {
                    alert("E-mail não encontrado ou senha incorreta.");
                }
            }
        });
    </script>
</body>
</html>
